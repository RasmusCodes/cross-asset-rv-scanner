# Curated relationships. Each one states WHY the prices should be linked and whether that link is enforceable.
#
# tier:
#   arbitrage   - a contractual or creation/redemption mechanism lets a trader force convergence (net of costs);
#   quasi       - an economic link with a convergence mechanism that cannot be forced on any timetable;
#   statistical - co-movement with no mechanism; any signal is a statistical bet, never an arbitrage.
#
# Compact list formats are expanded by rvscan.scanners.catalog.

etf_nav:
  # ETF market close vs the issuer's NAV (the value of the underlying basket at its close).
  # [etf, kind, note]
  - [SPY,  equity,      "Same-time US close; creation/redemption keeps the premium within a few bp."]
  - [DIA,  equity,      "Same-time US close."]
  - [XLK,  equity,      "Same-time US close."]
  - [XLE,  equity,      "Same-time US close."]
  - [KRE,  equity,      "Regional banks; NAV and market both at the US close."]
  - [KBE,  equity,      "Banks; NAV and market both at the US close."]
  - [XOP,  equity,      "Equal-weight E&P; NAV and market both at the US close."]
  - [XBI,  equity,      "Equal-weight biotech; NAV and market both at the US close."]
  - [JNK,  bond,        "High-yield bonds: NAV uses evaluated bid-side bond prices that lag the market in stress."]
  - [SPAB, bond,        "Aggregate bonds: evaluated prices."]
  - [SPTL, bond,        "Long Treasuries: evaluated prices."]
  - [BIL,  bond,        "T-bills: near-cash."]
  - [GLD,  commodity,   "NAV = LBMA gold price (London afternoon), ETF closes at 16:00 New York."]
  - [SPDW, equity_intl, "NAV struck at foreign closes, hours before the ETF's New York close (stale NAV)."]
  - [SPEM, equity_intl, "NAV struck at Asian/EM closes: stale by up to 15 hours."]
  - [GMF,  equity_intl, "Emerging Asia: NAV stale by 12-16 hours."]
  - [BWX,  bond_intl,   "International Treasuries: NAV at foreign closes, in local currencies."]
  - [EBND, bond_intl,   "EM local-currency bonds: NAV at foreign closes."]

same_index_etf:
  # Funds tracking the same index (or the same metal). Each is arbitraged to the same basket, but there is no
  # mechanism that converts one fund into the other: quasi. Spread = log total-return ratio, de-trended for fees.
  - [SPY, IVV, "Both track the S&P 500 (fee gap 6.5 bp/yr)."]
  - [IVV, VOO, "Both track the S&P 500."]
  - [SPY, VOO, "Both track the S&P 500."]
  - [GLD, IAU, "Both hold allocated gold bullion (fee gap 15 bp/yr)."]
  - [AGG, BND, "Aggregate bond index funds (different index providers)."]
  - [HYG, JNK, "High-yield index funds (iBoxx vs Bloomberg indices)."]
  - [EEM, VWO, "Emerging markets (MSCI vs FTSE: Korea classification differs)."]
  - [SMH, SOXX, "Semiconductor funds with overlapping holdings (different indices and caps)."]

