# Instrument universe.
#
# Every instrument has: id (unique), src (adapter), key (symbol / series id / table column), ccy, venue (close time),
# liq (cost tier in costs.yaml), name. Optional: unit, borrow (tier), nav (SSGA ticker for NAV history), tradable.
# Licence comes from the source (see sources below); `vendor` series never leave this machine row by row.

sources:
  yahoo:      {license: vendor,           credit: "Yahoo Finance chart API"}
  ssga:       {license: vendor,           credit: "State Street Global Advisors NAV history"}
  fred_fed:   {license: public-domain,    credit: "Board of Governors of the Federal Reserve System via FRED"}
  fred_ust:   {license: public-domain,    credit: "US Treasury via FRED"}
  fred_oecd:  {license: open-attribution, credit: "OECD Main Economic Indicators via FRED (CC BY 4.0)"}
  fred_nyfed: {license: open-attribution, credit: "Federal Reserve Bank of New York via FRED"}
  fred_boe:   {license: open-attribution, credit: "Bank of England via FRED"}
  fred_vendor: {license: vendor,          credit: "Moody's / ICE Data Indices via FRED (copyrighted)"}
  treasury:   {license: public-domain,    credit: "US Department of the Treasury"}
  eia:        {license: public-domain,    credit: "US Energy Information Administration"}
  ecb:        {license: open-attribution, credit: "European Central Bank Data Portal"}
  bundesbank: {license: open-attribution, credit: "Deutsche Bundesbank"}
  mof:        {license: open-attribution, credit: "Ministry of Finance Japan"}
  boc:        {license: open-attribution, credit: "Bank of Canada Valet API"}
  rba:        {license: open-attribution, credit: "Reserve Bank of Australia"}
  boe:        {license: open-attribution, credit: "Bank of England Database"}
  nyfed:      {license: open-attribution, credit: "Federal Reserve Bank of New York"}

# Close time of each venue / fixing (local time). Used to measure how far apart two legs' prices are in time.
venues:
  US:       {tz: America/New_York, close: "16:00"}
  TSX:      {tz: America/Toronto, close: "16:00"}
  LSE:      {tz: Europe/London, close: "16:30"}
  XETRA:    {tz: Europe/Berlin, close: "17:30"}
  EURONEXT: {tz: Europe/Paris, close: "17:30"}
  CPH:      {tz: Europe/Copenhagen, close: "17:00"}
  STO:      {tz: Europe/Stockholm, close: "17:30"}
  SIX:      {tz: Europe/Zurich, close: "17:30"}
  TSE:      {tz: Asia/Tokyo, close: "15:30"}
  TWSE:     {tz: Asia/Taipei, close: "13:30"}
  HKEX:     {tz: Asia/Hong_Kong, close: "16:10"}
  NSE:      {tz: Asia/Kolkata, close: "15:30"}
  ASX:      {tz: Australia/Sydney, close: "16:10"}
  KRX:      {tz: Asia/Seoul, close: "15:30"}
  B3:       {tz: America/Sao_Paulo, close: "17:00"}
  BMV:      {tz: America/Mexico_City, close: "15:00"}
  CME_EQ:   {tz: America/New_York, close: "16:00"}
  NYMEX:    {tz: America/New_York, close: "14:30"}
  COMEX:    {tz: America/New_York, close: "13:30"}
  CBOT:     {tz: America/New_York, close: "15:00"}
  FED_NOON: {tz: America/New_York, close: "12:00"}
  ECB_FIX:  {tz: Europe/Berlin, close: "14:15"}
  UST:      {tz: America/New_York, close: "15:30"}
  BBK:      {tz: Europe/Berlin, close: "17:30"}
  MOF:      {tz: Asia/Tokyo, close: "15:00"}
  BOC:      {tz: America/Toronto, close: "16:00"}
  RBA:      {tz: Australia/Sydney, close: "16:30"}
  BOE:      {tz: Europe/London, close: "16:30"}
  FIXING:   {tz: America/New_York, close: "08:00"}
  MONTHLY:  {tz: UTC, close: "00:00"}

