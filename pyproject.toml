[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rvscan"
version = "0.1.0"
description = "Cross-asset relative-value scanner: multi-asset data, cointegration / Kalman / OU / regime / Bayesian models, scanners, backtests."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "pyyaml>=6.0",
  "requests>=2.31",
  "pyarrow>=15",
  "xlrd>=2.0",
  "openpyxl>=3.1",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "statsmodels>=0.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
